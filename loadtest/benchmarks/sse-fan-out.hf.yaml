name: sse-fan-out

# SSE fan-out: 50 concurrent connections on /v1/events + append burst.

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 80

phases:
  - openConnections:
      always:
        users: 50
        duration: 160s
        scenario:
          - connectSSE:
              - httpRequest:
                  GET: /v1/events
                  headers:
                    Accept: text/event-stream
                    X-API-Key: agent-api-key-1
                    X-User-ID: loadtest-sse-1
                  metric: sse-connection
                  sync: false

  - appendBurst:
      always:
        users: 10
        duration: 30s
        startTime: 5s
        scenario:
          - burstAppend:
              # Pick a seeded conversation ID from CSV (same pattern as append-throughput).
              # Do NOT use a runtime search — the SSE users (loadtest-sse-*) own no
              # conversations, so the search would return empty data[].
              - randomCsvRow:
                  file: ../results/conversation-ids.csv
                  columns:
                    0: conversationId
              - httpRequest:
                  POST: /v1/conversations/${conversationId}/entries
                  headers:
                    Content-Type: application/json
                    X-API-Key: agent-api-key-1
                    X-User-ID: loadtest-user-1
                  body: |
                    {"contentType":"history","content":[{"role":"USER","text":"sse fan-out burst entry"}],"userId":"loadtest-user-1"}
                  metric: burst-append
