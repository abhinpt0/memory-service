name: sse-fan-out

# SSE fan-out: 50 concurrent connections on /v1/events + append burst.

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 80

phases:
  - openConnections:
      always:
        users: 50
        duration: 160s
        scenario:
          - connectSSE:
              # Wait up to 5 s for the first byte from the SSE stream (TTFB).
              # This gives a meaningful p50/p99 for connection establishment.
              # The step then completes and the connection is closed; SSE
              # fan-out pressure comes from the appendBurst phase below.
              - httpRequest:
                  GET: /v1/events
                  headers:
                    Accept: text/event-stream
                    X-API-Key: agent-api-key-1
                    X-User-ID: loadtest-sse-1
                  metric: sse-connection
                  timeout: 5s

  - appendBurst:
      always:
        users: 10
        duration: 30s
        startTime: 5s
        scenario:
          - burstAppend:
              # Pick a seeded conversation ID AND its ownerID from CSV so the
              # append is always authorised.  With a pool-of-5 seed, ~80% of
              # conversations are NOT owned by loadtest-user-1, so a hardcoded
              # user header would return 403 for most rows and poison latency data.
              - randomCsvRow:
                  file: ../results/conversation-ids.csv
                  columns:
                    0: conversationId
                    1: ownerID
              - httpRequest:
                  POST: /v1/conversations/${conversationId}/entries
                  headers:
                    Content-Type: application/json
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  body: |
                    {"contentType":"history","content":[{"role":"USER","text":"sse fan-out burst entry"}],"userId":"${ownerID}"}
                  metric: burst-append
