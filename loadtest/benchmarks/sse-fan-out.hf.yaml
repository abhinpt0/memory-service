name: sse-fan-out

# SSE fan-out: measure SSE connection TTFB (openConnections) and sustained
# append throughput under fan-out pressure (appendBurst).
#
# Routing note: SSE events are user-scoped — a subscriber on /v1/events only
# receives events for conversations owned by the authenticated user.  Both
# phases therefore use the same user identity (loadtest-user-1) so the
# subscriber actually receives the events that appendBurst generates.
# conversation-ids.csv col 1 carries ownerID; appendBurst filters the CSV to
# rows owned by loadtest-user-1 so all appends are authorised and routed to
# the open subscriber.
#
# CSV columns: col 0 = conversationId, col 1 = ownerID

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 80

phases:
  - openConnections:
      always:
        users: 50
        duration: 160s
        scenario:
          - connectSSE:
              # Wait up to 5 s for the first byte from the SSE stream (TTFB).
              # Uses loadtest-user-1 — the same user whose conversations
              # appendBurst writes to, so events are actually delivered here.
              - httpRequest:
                  GET: /v1/events
                  headers:
                    Accept: text/event-stream
                    X-API-Key: agent-api-key-1
                    X-User-ID: loadtest-user-1
                  metric: sse-connection
                  timeout: 5s

  - appendBurst:
      always:
        users: 10
        duration: 30s
        startTime: 5s
        scenario:
          - burstAppend:
              # sse-conversation-ids.csv contains ONLY conversations owned by
              # loadtest-user-1 (generated by manifest-to-csv.go).  Every append
              # is therefore authorised and every resulting SSE event is routed
              # to the loadtest-user-1 subscriber in openConnections above.
              - randomCsvRow:
                  file: ../results/sse-conversation-ids.csv
                  columns:
                    0: conversationId
                    1: ownerID
              - httpRequest:
                  POST: /v1/conversations/${conversationId}/entries
                  headers:
                    Content-Type: application/json
                    X-API-Key: agent-api-key-1
                    X-User-ID: ${ownerID}
                  body: |
                    {"contentType":"history","content":[{"role":"USER","text":"sse fan-out burst entry"}],"userId":"${ownerID}"}
                  metric: burst-append
