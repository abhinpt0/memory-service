name: list-entries

# Walks all entry pages for long-tail conversations (>100 entries).
# SLO: p99 < 300ms per page request (checked in run.sh from exported JSON)

http:
  - host: localhost
    port: 8082
    name: memory-service
    sharedConnections: 40

phases:
  - walkEntries:
      always:
        users: 20
        duration: 90s
        scenario:
          - walkEntryPages:
              - randomCsvRow:
                  file: ../results/long-tail-conversation-ids.csv
                  columns:
                    0: conversationId
              - httpRequest:
                  GET: /v1/conversations/${conversationId}/entries?limit=10
                  headers:
                    X-API-Key: agent-api-key-1
                    X-User-ID: loadtest-user-1
                  metric: list-entries-page
                  handler:
                    body:
                      json:
                        query: .afterCursor
                        toVar: afterCursor
              - breakSequence:
                  stringCondition:
                    fromVar: afterCursor
                    equalTo: null
              - httpRequest:
                  GET: /v1/conversations/${conversationId}/entries?limit=10&afterCursor=${afterCursor}
                  headers:
                    X-API-Key: agent-api-key-1
                    X-User-ID: loadtest-user-1
                  metric: list-entries-page
                  handler:
                    body:
                      json:
                        query: .afterCursor
                        toVar: afterCursor
